plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.lor.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.lor.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

kotlinOptions { jvmTarget = '17' }

buildFeatures { buildConfig true }
